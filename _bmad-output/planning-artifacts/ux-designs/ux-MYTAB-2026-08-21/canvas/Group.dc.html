<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.006em; background: #F4F7FA; color: #0A2038; -webkit-font-smoothing: antialiased; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    a { color: #1E51D2; } a:hover { color: #17409F; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F4F7FA; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A2038" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <div style="width: 32px; height: 32px; border-radius: 999px; background: #E7EDFC; color: #1E51D2; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">SD</div>
    <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.018em">Sukhumvit Dinner</div>
  </div>

  <div style="flex-grow: 1; padding: 8px 16px 24px">

    <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); padding: 20px; display: flex; align-items: center; gap: 14px">
      <div style="flex-grow: 1">
        <div class="num" style="font-size: 34px; font-weight: 600; letter-spacing: -0.028em; color: #B32B44; line-height: 1.05">฿291.74</div>
        <div style="font-size: 13px; color: #55677D; margin-top: 5px">You owe Maya</div>
      </div>
      <div style="min-height: 48px; display: flex; align-items: center; padding: 0 20px; border-radius: 10px; background: #1E51D2; color: #FFFFFF; box-shadow: inset 0 -1px 0 rgba(10, 32, 56, 0.24); font-size: 15px; font-weight: 600">Settle up</div>
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; margin: 28px 0 12px">Members</div>
    <div style="display: flex; gap: 14px">
      <sc-for list="{{members}}" as="m" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; width: 60px">
          <div style="position: relative">
            <div style="width: 48px; height: 48px; border-radius: 999px; background: {{m.tint}}; color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{m.initial}}</div>
            <div style="position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 999px; background: {{m.dot}}; border: 2.5px solid #F4F7FA"></div>
          </div>
          <span style="font-size: 12px; color: #55677D; text-align: center">{{m.name}}</span>
        </div>
      </sc-for>
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; margin: 28px 0 12px">Open tabs</div>
    <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); padding: 20px">
      <div style="display: flex; align-items: flex-start">
        <div style="flex-grow: 1">
          <div style="font-size: 16px; font-weight: 600">Sukhumvit Dinner</div>
          <div class="num" style="font-size: 13px; color: #55677D; margin-top: 3px">Locked · ฿1,840.00</div>
        </div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #B32B44">฿291.74</div>
      </div>
      <div style="margin-top: 16px; height: 4px; border-radius: 999px; background: #DFE7EF; overflow: hidden">
        <div style="height: 100%; width: 60%; background: #0B7561; border-radius: 999px"></div>
      </div>
      <div style="font-size: 13px; color: #55677D; margin-top: 8px">3 of 5 settled</div>
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; margin: 28px 0 12px">Activity</div>
    <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); overflow: hidden">
      <sc-for list="{{feed}}" as="e" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #DFE7EF">
          <div style="width: 30px; height: 30px; border-radius: 999px; background: {{e.tint}}; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{e.initial}}</div>
          <div style="flex-grow: 1; font-size: 14px; line-height: 1.35">{{e.text}}</div>
          <div style="font-size: 13px; color: #55677D">{{e.when}}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 24px; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DFE7EF; font-size: 15px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A2038" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Start a tab
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      members: [
        { name: 'Maya', initial: 'M', tint: '#B0603E', dot: '#0B7561' },
        { name: 'You',  initial: 'A', tint: '#1E51D2', dot: '#B32B44' },
        { name: 'Noi',  initial: 'N', tint: '#0B7561', dot: '#0B7561' },
        { name: 'Ploy', initial: 'P', tint: '#9A6209', dot: '#B32B44' },
        { name: 'Tim',  initial: 'T', tint: '#55677D', dot: '#0B7561' }
      ],
      feed: [
        { initial: 'N', tint: '#0B7561', text: 'Noi paid Maya ฿255.26', when: '2m' },
        { initial: 'T', tint: '#55677D', text: 'Tim paid Maya ฿437.59', when: '5m' },
        { initial: 'M', tint: '#B0603E', text: 'Maya locked the bill',   when: '8m' },
        { initial: 'P', tint: '#9A6209', text: 'Ploy claimed Som Tam',   when: '12m' }
      ]
    };
  }
}
</script>
</body>
</html>
