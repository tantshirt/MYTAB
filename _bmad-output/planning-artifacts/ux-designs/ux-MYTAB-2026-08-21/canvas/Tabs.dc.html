<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.006em; background: #F4F7FA; color: #0A2038; -webkit-font-smoothing: antialiased; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    a { color: #1E51D2; } a:hover { color: #17409F; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F4F7FA; display: flex; flex-direction: column">

  <div style="flex-grow: 1; padding: 28px 16px 24px">

    <div style="margin-bottom: 28px">
      <div class="num" style="font-size: 42px; font-weight: 600; letter-spacing: -0.032em; line-height: 1.05; color: {{heroColor}}">{{heroAmount}}</div>
      <div style="font-size: 13px; color: #55677D; margin-top: 6px">{{heroSub}}</div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 32px">
      <div style="flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1E51D2; color: #FFFFFF; border-radius: 10px; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Start a tab
      </div>
      <div style="flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #FFFFFF; color: #0A2038; border: 1px solid #DFE7EF; border-radius: 10px; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A85F2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V8M12 8l-4 4M12 8l4 4"></path><circle cx="12" cy="4" r="1.6"></circle></svg>
        Send a tip
      </div>
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px">Open tabs</div>
    <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); padding: 20px; margin-bottom: 32px">
      <div style="display: flex; align-items: flex-start; gap: 12px">
        <div style="flex-grow: 1">
          <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Sukhumvit Dinner</div>
          <div class="num" style="font-size: 13px; color: #55677D; margin-top: 3px">5 people · ฿1,840.00</div>
        </div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: {{heroColor}}">{{tabAmount}}</div>
      </div>
      <div style="margin-top: 16px; height: 4px; border-radius: 999px; background: #DFE7EF; overflow: hidden">
        <div style="height: 100%; width: {{progressPct}}; background: #0B7561; border-radius: 999px"></div>
      </div>
      <div style="font-size: 13px; color: #55677D; margin-top: 8px">{{progressLabel}}</div>
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px">Groups</div>
    <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); padding: 16px 20px; margin-bottom: 32px; display: flex; align-items: center; gap: 14px">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #E7EDFC; color: #1E51D2; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">SD</div>
      <div style="flex-grow: 1; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">Sukhumvit Dinner</div>
        <div style="font-size: 13px; color: #55677D; margin-top: 2px">{{groupPosition}}</div>
      </div>
      <div style="display: flex">
        <div style="width: 26px; height: 26px; border-radius: 999px; background: #B0603E; color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">M</div>
        <div style="width: 26px; height: 26px; border-radius: 999px; background: #0B7561; color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-left: -9px">N</div>
        <div style="width: 26px; height: 26px; border-radius: 999px; background: #9A6209; color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-left: -9px">P</div>
        <div style="width: 26px; height: 26px; border-radius: 999px; background: #F4F7FA; color: #55677D; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-left: -9px">+2</div>
      </div>
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px">Recent</div>
    <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); overflow: hidden">
      <sc-for list="{{feed}}" as="e" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #DFE7EF">
          <div style="width: 30px; height: 30px; border-radius: 999px; background: {{e.tint}}; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{e.initial}}</div>
          <div style="flex-grow: 1; font-size: 14px; line-height: 1.35">{{e.text}}</div>
          <div style="font-size: 13px; color: #55677D">{{e.when}}</div>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="display: flex; background: #FFFFFF; border-top: 1px solid #DFE7EF; padding: 10px 0 22px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #1E51D2">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14a1 1 0 011 1v16l-4-2-4 2-4-2-4 2V4a1 1 0 011-1z"></path><path d="M8 8h8M8 12h5"></path></svg>
      <span style="font-size: 11px; font-weight: 600">Tabs</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #55677D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Activity</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #55677D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"></path></svg>
      <span style="font-size: 11px; font-weight: 500">You</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "balance": {"editor": "enum", "options": ["owes", "owed", "square"], "default": "owes", "section": "State"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const b = this.props.balance ?? 'owes';
    const map = {
      owes:   { amount: 'You owe ฿291.74',      color: '#B32B44', sub: 'across 1 group',                tab: '฿291.74', group: 'You owe ฿291.74' },
      owed:   { amount: 'You are owed ฿559.15', color: '#0B7561', sub: 'from 4 people in 1 group',      tab: '฿559.15', group: 'You are owed ฿559.15' },
      square: { amount: 'All square',           color: '#0A2038', sub: 'nothing outstanding',           tab: 'Settled',  group: 'All square' }
    };
    const m = map[b];
    return {
      heroAmount: m.amount,
      heroColor: m.color,
      heroSub: m.sub,
      tabAmount: m.tab,
      groupPosition: m.group,
      progressPct: b === 'square' ? '100%' : '60%',
      progressLabel: b === 'square' ? '5 of 5 settled' : '3 of 5 settled',
      feed: [
        { initial: 'N', tint: '#0B7561', text: 'Noi paid you ฿255.26', when: '2m' },
        { initial: 'M', tint: '#B0603E', text: 'Maya locked the bill',  when: '8m' },
        { initial: 'P', tint: '#9A6209', text: 'Ploy claimed Som Tam',  when: '12m' }
      ]
    };
  }
}
</script>
</body>
</html>
