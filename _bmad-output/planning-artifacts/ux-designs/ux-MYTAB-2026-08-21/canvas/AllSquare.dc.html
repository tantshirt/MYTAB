<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.006em; background: #F4F7FA; color: #0A2038; -webkit-font-smoothing: antialiased; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    a { color: #1E51D2; } a:hover { color: #17409F; }
    @keyframes mt-draw { from { stroke-dashoffset: 34; } to { stroke-dashoffset: 0; } }
    @keyframes mt-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F4F7FA; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 46%; background: linear-gradient(180deg, #F6E9DC 0%, #F7EFE7 45%, #F4F7FA 100%)"></div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px; text-align: center">

    <div style="width: 84px; height: 84px; border-radius: 999px; background: #FFFFFF; border: 2px solid #A85F2E; display: flex; align-items: center; justify-content: center; margin-bottom: 28px; animation: mt-rise 420ms ease both">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#A85F2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" stroke-dasharray="34" style="animation: mt-draw 480ms 220ms ease both"></path>
      </svg>
    </div>

    <div style="font-size: 42px; font-weight: 600; letter-spacing: -0.032em; line-height: 1.05; animation: mt-rise 420ms 80ms ease both">All square</div>

    <div class="num" style="font-size: 15px; color: #55677D; margin-top: 12px; animation: mt-rise 420ms 140ms ease both">Sukhumvit Dinner · ฿1,840.00</div>

    <div style="display: flex; align-items: center; gap: 9px; margin-top: 22px; animation: mt-rise 420ms 200ms ease both">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#DFE7EF" stroke-width="3"></circle><circle cx="12" cy="12" r="9" stroke="#0B7561" stroke-width="3" stroke-linecap="round" stroke-dasharray="56.5" stroke-dashoffset="0" transform="rotate(-90 12 12)"></circle></svg>
      <span class="num" style="font-size: 15px; font-weight: 600; color: #0B7561">5 of 5 settled</span>
    </div>

    <div style="display: flex; margin-top: 34px; animation: mt-rise 420ms 260ms ease both">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
        <div style="width: 40px; height: 40px; border-radius: 999px; background: {{p.tint}}; color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 3px solid #F4F7FA; margin-left: -10px">{{p.initial}}</div>
      </sc-for>
    </div>

    <div style="font-size: 16px; font-weight: 500; margin-top: 32px; letter-spacing: -0.005em; animation: mt-rise 420ms 320ms ease both">Your group tab. Settled.</div>

  </div>

  <div style="position: relative; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 10px; background: #1E51D2; color: #FFFFFF; box-shadow: inset 0 -1px 0 rgba(10, 32, 56, 0.24); font-size: 16px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7"></path><path d="M12 15V3M12 3L8 7M12 3l4 4"></path></svg>
      Share to group
    </div>
    <div style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #55677D">Done</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      people: [
        { initial: 'M', tint: '#B0603E' },
        { initial: 'A', tint: '#1E51D2' },
        { initial: 'N', tint: '#0B7561' },
        { initial: 'P', tint: '#9A6209' },
        { initial: 'T', tint: '#55677D' }
      ]
    };
  }
}
</script>
</body>
</html>
