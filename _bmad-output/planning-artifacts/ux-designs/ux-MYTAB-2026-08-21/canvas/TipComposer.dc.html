<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.006em; background: #F4F7FA; color: #0A2038; -webkit-font-smoothing: antialiased; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    a { color: #1E51D2; } a:hover { color: #17409F; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F4F7FA; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A2038" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.018em">Send a tip</div>
  </div>

  <div style="flex-grow: 1; padding: 8px 0 24px">

    <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; padding: 0 16px; margin-bottom: 12px">To</div>
    <div style="display: flex; gap: 16px; padding: 0 16px 4px; overflow-x: auto">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <div onClick="{{p.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; flex-shrink: 0; width: 56px">
          <div style="width: 52px; height: 52px; border-radius: 999px; background: {{p.tint}}; color: #fff; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 {{p.ring}}">{{p.initial}}</div>
          <span style="font-size: 13px; font-weight: {{p.weight}}; color: {{p.nameColor}}">{{p.name}}</span>
        </div>
      </sc-for>
    </div>

    <div style="text-align: center; margin: 38px 0 24px">
      <div class="num" style="font-size: 42px; font-weight: 600; letter-spacing: -0.032em; line-height: 1">{{amount}}</div>
      <div style="font-size: 13px; color: #55677D; margin-top: 8px">{{recipientLine}}</div>
    </div>

    <div style="display: flex; gap: 8px; padding: 0 16px; margin-bottom: 30px">
      <sc-for list="{{presets}}" as="v" hint-placeholder-count="5">
        <div onClick="{{v.pick}}" style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{v.bg}}; color: {{v.color}}; border: 1px solid {{v.border}}; cursor: pointer">{{v.label}}</div>
      </sc-for>
    </div>

    <div style="padding: 0 16px">
      <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 10px; padding: 14px 16px; font-size: 15px; color: {{noteColor}}">{{noteText}}</div>
      <div style="display: flex; gap: 8px; margin-top: 12px">
        <sc-for list="{{reactions}}" as="r" hint-placeholder-count="6">
          <div onClick="{{r.pick}}" style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 999px; background: {{r.bg}}; border: 1px solid {{r.border}}; cursor: pointer">{{r.glyph}}</div>
        </sc-for>
      </div>
    </div>

    <div style="padding: 0 16px; margin-top: 26px">
      <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); padding: 16px 18px; display: flex; align-items: center; gap: 12px">
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 500">Paying with USDC</div>
          <div style="font-size: 13px; color: #55677D; margin-top: 3px">{{receivesLine}}</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55677D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </div>

  </div>

  <div style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #DFE7EF; padding: 14px 16px 22px">
    <div style="min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 10px; background: #1E51D2; color: #FFFFFF; box-shadow: inset 0 -1px 0 rgba(10, 32, 56, 0.24); font-size: 16px; font-weight: 600">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F1CBB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V8M12 8l-4 4M12 8l4 4"></path><circle cx="12" cy="4" r="1.6"></circle></svg>
      {{ctaLabel}}
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { to: 'maya', amount: 10000, reaction: null };
    this.roster = [
      { id: 'maya', name: 'Maya', initial: 'M', tint: '#B0603E' },
      { id: 'noi',  name: 'Noi',  initial: 'N', tint: '#0B7561' },
      { id: 'ploy', name: 'Ploy', initial: 'P', tint: '#9A6209' },
      { id: 'tim',  name: 'Tim',  initial: 'T', tint: '#55677D' }
    ];
  }
  baht(m) { return '฿' + (m / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  renderVals() {
    const self = this;
    const to = this.roster.filter(function (p) { return p.id === self.state.to; })[0];

    const people = this.roster.map(function (p) {
      const on = self.state.to === p.id;
      return {
        name: p.name, initial: p.initial, tint: p.tint,
        ring: on ? '2px #1E51D2' : '0 transparent',
        weight: on ? '600' : '400',
        nameColor: on ? '#0A2038' : '#55677D',
        pick: function () { self.setState({ to: p.id }); }
      };
    });

    const presets = [2000, 5000, 10000, 20000].map(function (v) {
      const on = self.state.amount === v;
      return {
        label: '฿' + (v / 100),
        bg: on ? '#E7EDFC' : '#FFFFFF',
        color: on ? '#1E51D2' : '#0A2038',
        border: on ? '#1E51D2' : '#DFE7EF',
        pick: function () { self.setState({ amount: v }); }
      };
    });
    presets.push({ label: 'Custom', bg: '#FFFFFF', color: '#55677D', border: '#DFE7EF', pick: function () {} });

    const reactions = ['🙏', '🔥', '💐', '🍜', '👏', '🫶'].map(function (g) {
      const on = self.state.reaction === g;
      return {
        glyph: g,
        bg: on ? '#F8EDE4' : '#FFFFFF',
        border: on ? '#A85F2E' : '#DFE7EF',
        pick: function () { self.setState({ reaction: on ? null : g }); }
      };
    });

    return {
      people: people,
      presets: presets,
      reactions: reactions,
      amount: this.baht(this.state.amount),
      recipientLine: 'to ' + to.name,
      receivesLine: to.name + ' receives USDC',
      noteText: 'Say something nice…',
      noteColor: '#55677D',
      ctaLabel: 'Send tip'
    };
  }
}
</script>
</body>
</html>
