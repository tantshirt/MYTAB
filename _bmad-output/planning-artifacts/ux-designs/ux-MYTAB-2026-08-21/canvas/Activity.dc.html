<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.006em; background: #F4F7FA; color: #0A2038; -webkit-font-smoothing: antialiased; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    a { color: #1E51D2; } a:hover { color: #17409F; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F4F7FA; display: flex; flex-direction: column">

  <div style="padding: 24px 16px 12px">
    <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.018em">Activity</div>
  </div>

  <div style="flex-grow: 1; padding: 0 16px 24px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="margin-bottom: 22px">
        <div style="font-size: 11px; font-weight: 600; color: #61748B; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px">{{g.day}}</div>
        <div style="background: #FFFFFF; border: 1px solid #DFE7EF; border-radius: 12px; box-shadow: 0 1px 2px rgba(10, 32, 56, 0.045); overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
            <div style="border-bottom: 1px solid #DFE7EF">
              <div onClick="{{r.tap}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer">
                <div style="width: 32px; height: 32px; border-radius: 999px; background: {{r.iconBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                  <div style="width: 14px; height: 14px; border-radius: 3px; background: {{r.iconFg}}"></div>
                </div>
                <div style="flex-grow: 1; min-width: 0">
                  <div style="font-size: 14px; line-height: 1.35">{{r.text}}</div>
                </div>
                <div style="text-align: right">
                  <div class="num" style="font-size: 14px; font-weight: 600; color: {{r.amountColor}}">{{r.amount}}</div>
                  <div style="font-size: 12px; color: #55677D; margin-top: 2px">{{r.when}}</div>
                </div>
              </div>
              <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
                <div style="padding: 2px 16px 16px 60px; display: flex; flex-direction: column; gap: 8px">
                  <div style="display: flex"><span style="flex-grow: 1; font-size: 13px; color: #55677D">From</span><span style="font-size: 13px">Sukhumvit Dinner</span></div>
                  <div style="display: flex"><span style="flex-grow: 1; font-size: 13px; color: #55677D">Received</span><span class="num" style="font-size: 13px">7.22 USDC</span></div>
                  <div style="display: flex"><span style="flex-grow: 1; font-size: 13px; color: #55677D">Network fee</span><span style="font-size: 13px; color: #0B7561">Covered by My Tab</span></div>
                  <div style="font-size: 13px; margin-top: 2px"><a href="#">View on explorer</a></div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; background: #FFFFFF; border-top: 1px solid #DFE7EF; padding: 10px 0 22px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #55677D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14a1 1 0 011 1v16l-4-2-4 2-4-2-4 2V4a1 1 0 011-1z"></path><path d="M8 8h8M8 12h5"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Tabs</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #1E51D2">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg>
      <span style="font-size: 11px; font-weight: 600">Activity</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #55677D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"></path></svg>
      <span style="font-size: 11px; font-weight: 500">You</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'paid-noi' };
    this.data = [
      { day: 'Today', rows: [
        { id: 'paid-noi',  text: 'Noi paid you ฿255.26',      amount: '+฿255.26', kind: 'settle', when: '2m' },
        { id: 'paid-tim',  text: 'Tim paid you ฿437.59',      amount: '+฿437.59', kind: 'settle', when: '5m' },
        { id: 'tip-maya',  text: 'You tipped Maya ฿100.00',   amount: '−฿100.00', kind: 'tip',    when: '6m' },
        { id: 'lock',      text: 'Maya locked Sukhumvit Dinner', amount: '',      kind: 'quiet',  when: '8m' }
      ]},
      { day: 'Yesterday', rows: [
        { id: 'claim',     text: 'Ploy claimed Som Tam',      amount: '',         kind: 'quiet',  when: '19:42' },
        { id: 'join',      text: 'Tim joined the tab',        amount: '',         kind: 'quiet',  when: '19:38' }
      ]}
    ];
  }
  renderVals() {
    const self = this;
    const tint = {
      settle: { bg: '#E1F0EC', fg: '#0B7561', amount: '#0B7561' },
      tip:    { bg: '#F8EDE4', fg: '#A85F2E', amount: '#0A2038' },
      quiet:  { bg: '#EDF2F7', fg: '#55677D', amount: '#55677D' }
    };
    return {
      groups: this.data.map(function (g) {
        return {
          day: g.day,
          rows: g.rows.map(function (r) {
            const t = tint[r.kind];
            return {
              text: r.text, amount: r.amount, when: r.when,
              iconBg: t.bg, iconFg: t.fg, amountColor: t.amount,
              open: self.state.open === r.id && r.kind === 'settle',
              tap: function () { self.setState({ open: self.state.open === r.id ? null : r.id }); }
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
